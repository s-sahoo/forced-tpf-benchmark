[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-uno"
version = "0.1.0"
description = "A compact GPU inference engine with unified autoregressive and two-pass decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.7,<3",
  "transformers>=4.53,<6",
  "safetensors>=0.5,<1",
  "huggingface-hub>=0.34,<2",
  "numpy>=2.3,<3",
  "tqdm>=4.67,<5",
  "xxhash>=3.5,<4",
  "triton>=3.3,<4",
  "flash-attn>=2.8.3,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
eval = [
  "datasets==5.0.0",
]

[project.urls]
Repository = "https://github.com/drproduck/nano-vllm-uno"

[tool.setuptools.packages.find]
where = ["."]
include = ["nano_vllm_uno*"]
exclude = ["nano_vllm_uno.tests*"]
namespaces = true
